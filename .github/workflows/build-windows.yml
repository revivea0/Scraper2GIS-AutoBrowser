name: Build Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Package desktop app
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name Scraper2GIS --add-data "gui:gui" --collect-all playwright --collect-all webview --recursive-copy-metadata playwright --recursive-copy-metadata pywebview --recursive-copy-metadata openpyxl main.py
      - name: Check bundle
        shell: pwsh
        run: |
          if (!(Test-Path dist/Scraper2GIS/Scraper2GIS.exe)) { throw 'Executable missing' }
          if (!(Test-Path dist/Scraper2GIS/_internal/gui/index.html)) { throw 'UI missing' }
          Copy-Item README.md dist/Scraper2GIS/README.md
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/Scraper2GIS/LICENSE }
      - uses: actions/upload-artifact@v7
        with:
          name: Scraper2GIS-Windows
          path: dist/Scraper2GIS/
          if-no-files-found: error
          retention-days: 14
